<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Minesweeper | Fully Responsive React Game</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Development UMD builds) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for in-browser JSX/TSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Apply Inter font */
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom styles for the grid and responsive display */
      #minesweeper-grid {
        display: grid;
        width: fit-content;
        margin: 0 auto;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }
      .cell-button {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        border: 1px solid #ccc; /* fallback border */
        box-sizing: border-box;
      }

      /* Responsive adjustments for cell size on smaller screens */
      @media (max-width: 640px) {
        .cell-button {
          width: 28px;
          height: 28px;
          font-size: 12px;
        }
      }
      
      /* Number color classes for Minesweeper */
      .num-1 { color: #1565C0; } /* Blue */
      .num-2 { color: #388E3C; } /* Green */
      .num-3 { color: #D32F2F; } /* Red */
      .num-4 { color: #7B1FA2; } /* Purple */
      .num-5 { color: #FF6F00; } /* Orange */
      .num-6 { color: #00838F; } /* Cyan */
      .num-7 { color: #000000; } /* Black */
      .num-8 { color: #616161; } /* Gray */
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen p-4 sm:p-8">
    <div id="root" class="flex justify-center items-start pt-4"></div>

    <script type="text/babel" data-presets="typescript,react">
      const { useEffect, useMemo, useRef, useState, useCallback } = React;

      // --- Types ---
      // Keeping types for reference, but avoiding using them in function signatures and useState generics.
      type Cell = {
        x: number; y: number; isMine: boolean; isRevealed: boolean; isFlagged: boolean; neighborMines: number;
      };
      type Board = Cell[][];
      type Difficulty = { label: string; cols: number; rows: number; mines: number; };

      // --- Constants ---
      const DIFFICULTIES: Difficulty[] = [
        { label: "Beginner (9x9, 10 Mines)", cols: 9, rows: 9, mines: 10 },
        { label: "Intermediate (16x16, 40 Mines)", cols: 16, rows: 16, mines: 40 },
        { label: "Expert (30x16, 99 Mines)", cols: 30, rows: 16, mines: 99 },
      ];
      
      const numberClass = {
        1: "num-1", 2: "num-2", 3: "num-3", 4: "num-4",
        5: "num-5", 6: "num-6", 7: "num-7", 8: "num-8",
      };

      // --- Helpers ---
      function createEmptyBoard(cols, rows) { // Removed type annotations
        const grid = [];
        for (let y = 0; y < rows; y++) {
          const row = [];
          for (let x = 0; x < cols; x++) {
            row.push({ x, y, isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 });
          }
          grid.push(row);
        }
        return grid;
      }

      function inBounds(cols, rows, x, y) { // Removed type annotations
        return x >= 0 && y >= 0 && x < cols && y < rows;
      }

      function neighborsOf(cols, rows, x, y) { // Removed type annotations
        const neighbors = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (inBounds(cols, rows, nx, ny)) {
              neighbors.push({ x: nx, y: ny });
            }
          }
        }
        // NOTE: The return type is implicitly { x: number, y: number }[]
        return neighbors;
      }

      function initializeBoard(
        cols, rows, mines, startX, startY // Removed type annotations
      ) {
        let newBoard = createEmptyBoard(cols, rows);
        
        // This Set no longer needs the explicit generic type <string>
        const cellsToAvoid = new Set();

        // Avoid placing mines on the starting cell and its immediate neighbors (3x3 area)
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                const ax = startX + dx;
                const ay = startY + dy;
                if (inBounds(cols, rows, ax, ay)) {
                    cellsToAvoid.add(`${ax},${ay}`);
                }
            }
        }

        // Place mines
        let minesPlaced = 0;
        while (minesPlaced < mines) {
          const x = Math.floor(Math.random() * cols);
          const y = Math.floor(Math.random() * rows);

          if (!newBoard[y][x].isMine && !cellsToAvoid.has(`${x},${y}`)) {
            newBoard[y][x].isMine = true;
            minesPlaced++;
          }
        }

        // Calculate neighbor mine counts
        newBoard = newBoard.map((row, y) => row.map((cell, x) => {
          if (!cell.isMine) {
            cell.neighborMines = neighborsOf(cols, rows, x, y).reduce((count, n) => {
              return count + (newBoard[n.y][n.x].isMine ? 1 : 0);
            }, 0);
          }
          return cell;
        }));

        // NOTE: The return type is implicitly Board
        return newBoard;
      }

      // --- Component ---
      function Minesweeper() {
        const [difficulty, setDifficulty] = useState(DIFFICULTIES[0]);
        // Corrected: Removed the explicit type annotation <Board>
        const [board, setBoard] = useState(() => createEmptyBoard(difficulty.cols, difficulty.rows));
        const [alive, setAlive] = useState(true);
        const [minesLeft, setMinesLeft] = useState(difficulty.mines);
        const [initialized, setInitialized] = useState(false);
        const [won, setWon] = useState(false);
        const [flagMode, setFlagMode] = useState(false); // For touch screens

        const { cols, rows, mines } = difficulty;

        // Memoize the total safe cells needed to win
        const totalSafeCells = useMemo(() => cols * rows - mines, [cols, rows, mines]);

        // --- Core Logic ---

        // Recursively reveals empty cells
        const floodFill = useCallback((
          currentBoard, // Removed : Board
          x,            // Removed : number
          y             // Removed : number
        ) => { // Removed ): [Board, boolean] return type annotation
          if (!inBounds(cols, rows, x, y) || currentBoard[y][x].isRevealed) {
            return [currentBoard, false];
          }

          const cell = currentBoard[y][x];
          cell.isRevealed = true;
          cell.isFlagged = false; // Cannot be flagged once revealed

          if (cell.isMine) {
            // Should not happen during flood fill but good safeguard
            return [currentBoard, true]; // Boom!
          }

          let wasAnyChange = true;
          if (cell.neighborMines === 0) {
            // Recurse for all neighbors only if current cell has no neighbor mines
            for (const { x: nx, y: ny } of neighborsOf(cols, rows, x, y)) {
                // Ignore the return value for explosion, as the parent call handles it
                const [nextBoard, exploded] = floodFill(currentBoard, nx, ny);
                currentBoard = nextBoard;
                if (exploded) return [currentBoard, true];
                wasAnyChange = wasAnyChange || (currentBoard[ny][nx].isRevealed && !currentBoard[ny][nx].isMine);
            }
          }
          return [currentBoard, false]; // No explosion
        }, [cols, rows]);

        // Function to handle cell click (reveal or flag)
        const handleCellClick = useCallback((x, y, isFlagging) => { // Removed type annotations
          setBoard(prevBoard => {
            if (!alive || won) return prevBoard;
            let newBoard = [...prevBoard.map(row => [...row])];
            let cell = newBoard[y][x];
            
            // 1. Handle Flagging
            if (isFlagging || flagMode) {
              if (cell.isRevealed) return prevBoard; // Cannot flag revealed cells
              cell.isFlagged = !cell.isFlagged;
              setMinesLeft(m => m + (cell.isFlagged ? -1 : 1));
              return newBoard;
            }

            // 2. First Click Initialization (Avoids first click boom)
            if (!initialized) {
              newBoard = initializeBoard(cols, rows, mines, x, y);
              cell = newBoard[y][x]; // Update reference to the new board
              setInitialized(true);
            }
            
            // 3. Handle Revealing
            if (cell.isFlagged || cell.isRevealed) return prevBoard;

            if (cell.isMine) {
              cell.isRevealed = true;
              setAlive(false);
              return newBoard; // BOOM!
            }

            // Perform flood fill if the cell is empty (neighborMines === 0)
            const [filledBoard, exploded] = floodFill(newBoard, x, y);
            if (exploded) setAlive(false); // Should not happen with first-click logic, but handles potential future issues
            
            return filledBoard;
          });
        }, [alive, won, initialized, cols, rows, mines, flagMode, floodFill]);

        // Handle chord click (double-click a revealed number)
        const handleChord = useCallback((x, y) => { // Removed type annotations
            setBoard(prevBoard => {
                if (!alive || won) return prevBoard;
                
                const cell = prevBoard[y][x];
                if (!cell.isRevealed || cell.neighborMines === 0) return prevBoard;

                const currentNeighbors = neighborsOf(cols, rows, x, y);
                const flaggedNeighbors = currentNeighbors.filter(n => prevBoard[n.y][n.x].isFlagged).length;

                if (flaggedNeighbors === cell.neighborMines) {
                    // Start revealing non-flagged neighbors
                    let newBoard = [...prevBoard.map(row => [...row])];
                    let exploded = false;

                    currentNeighbors.forEach(n => {
                        const neighborCell = newBoard[n.y][n.x];
                        if (!neighborCell.isFlagged && !neighborCell.isRevealed) {
                            if (neighborCell.isMine) {
                                neighborCell.isRevealed = true;
                                exploded = true;
                            } else {
                                const [filledBoard, exp] = floodFill(newBoard, n.x, n.y);
                                newBoard = filledBoard;
                                if (exp) exploded = true;
                            }
                        }
                    });

                    if (exploded) setAlive(false);
                    return newBoard;
                }
                return prevBoard;
            });
        }, [alive, won, cols, rows, floodFill]);


        // --- Effects and Resets ---

        // Check for win condition
        useEffect(() => {
          if (!alive || won) return;

          const revealedCount = board.reduce(
            (count, row) => count + row.filter(cell => cell.isRevealed && !cell.isMine).length,
            0
          );

          if (revealedCount === totalSafeCells && totalSafeCells > 0) {
            setWon(true);
            // Auto-flag remaining mines
            setBoard(b => b.map(row => row.map(cell => {
              if (cell.isMine && !cell.isFlagged) {
                return { ...cell, isFlagged: true };
              }
              return cell;
            })));
            setMinesLeft(0);
          }
        }, [board, alive, won, totalSafeCells]);

        // Reset the game state when difficulty changes or on manual restart
        const resetGame = useCallback((newDifficulty = difficulty) => {
          setDifficulty(newDifficulty);
          setBoard(createEmptyBoard(newDifficulty.cols, newDifficulty.rows));
          setAlive(true);
          setWon(false);
          setInitialized(false);
          setMinesLeft(newDifficulty.mines);
        }, [difficulty]);

        // Handle global context menu (right-click) to prevent default context menu
        useEffect(() => {
          const handleContext = (e) => { // Removed : MouseEvent
            // Only prevent if the user is right-clicking outside of a control
            const target = e.target;
            if (!target || !(target instanceof HTMLElement) || !target.closest('#minesweeper-grid')) {
              e.preventDefault();
            }
          };
          document.addEventListener('contextmenu', handleContext);
          return () => document.removeEventListener('contextmenu', handleContext);
        }, []);


        // Function to handle cell right-click (context menu event)
        const handleContextMenu = (e, x, y) => { // Removed type annotations
          e.preventDefault();
          e.stopPropagation();
          // Check for shift key press for desktop flag toggle
          const isFlagging = e.shiftKey || !flagMode;
          handleCellClick(x, y, isFlagging);
        };
        
        // --- Render Logic ---

        const gridStyle = {
          gridTemplateColumns: `repeat(${cols}, 1fr)`,
        };

        const buttonBaseClass = "cell-button transition-all duration-75 text-center cursor-pointer select-none border-gray-400";

        return (
          <div className="w-full max-w-4xl p-4 md:p-8 bg-white rounded-3xl shadow-xl">
            <h1 className="text-3xl font-extrabold text-gray-800 text-center mb-6">Minesweeper</h1>

            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
              {/* Difficulty Selector */}
              <select
                className="p-2 border border-gray-300 rounded-lg shadow-sm text-sm"
                value={difficulty.label}
                onChange={(e) => {
                  const newDiff = DIFFICULTIES.find(d => d.label === e.target.value);
                  if (newDiff) resetGame(newDiff);
                }}
                disabled={initialized && alive}
              >
                {DIFFICULTIES.map(d => (
                  <option key={d.label} value={d.label}>{d.label}</option>
                ))}
              </select>

              {/* Status and Reset */}
              <div className="flex items-center gap-4">
                <span className={`text-xl font-mono px-3 py-1 rounded-lg ${minesLeft < 0 ? 'bg-red-200' : 'bg-green-100'} text-gray-800 shadow-inner`}>
                  🚩 {Math.max(0, minesLeft)}
                </span>
                <button
                  onClick={() => resetGame()}
                  className={`p-2 rounded-full text-2xl transition-transform ${alive && initialized ? 'hover:scale-110 active:scale-95' : 'bg-yellow-200 hover:bg-yellow-300 active:bg-yellow-400'}`}
                  title="Reset Game"
                >
                  {won ? '😎' : alive && initialized ? '🤔' : alive ? '😊' : '🤕'}
                </button>
              </div>

              {/* Touch Flag Mode Toggle */}
              <button
                onClick={() => setFlagMode(f => !f)}
                className={`sm:hidden p-2 text-sm rounded-lg font-medium transition-colors ${
                  flagMode ? 'bg-indigo-600 text-white shadow-md' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
                }`}
              >
                {flagMode ? 'Flag Mode: ON 🚩' : 'Flag Mode: OFF'}
              </button>
            </div>

            {/* Game Grid */}
            <div className="overflow-x-auto p-2 bg-gray-100 rounded-xl shadow-inner">
                <div id="minesweeper-grid" style={gridStyle}>
                  {board.map((row, y) =>
                    row.map((cell, x) => {
                      const { isRevealed: revealed, isMine: mine, isFlagged: flagged } = cell;

                      const btnClass = 
                        `${buttonBaseClass} ` +
                        (revealed 
                          ? (mine 
                            ? 'bg-red-500 text-white' 
                            : 'bg-gray-200 border-gray-300 shadow-inner') 
                          : (alive && initialized 
                            ? 'bg-green-400 hover:bg-green-500 active:bg-green-600 border-b-4 border-r-4 border-t-2 border-l-2 border-green-500 active:border-green-700' 
                            : 'bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600 border-b-4 border-r-4 border-t-2 border-l-2 border-yellow-500 active:border-yellow-700')
                        );

                      return (
                        <button
                          key={`${x}-${y}`}
                          className={btnClass}
                          onClick={() => handleCellClick(x, y, false)}
                          onContextMenu={(e) => handleContextMenu(e, x, y)}
                          onDoubleClick={() => handleChord(x, y)}
                          disabled={!alive || won}
                          aria-label={`cell ${x},${y}`}
                        >
                          {!revealed && flagged && "🚩"}
                          {revealed && mine && "💣"}
                          {revealed && !mine && cell.neighborMines > 0 && (
                            <span className={numberClass[cell.neighborMines] || ""}>{cell.neighborMines}</span>
                          )}
                        </button>
                      );
                    })
                  )}
                </div>
              </div>

              {/* Footer / Tips */}
              <div className="mt-6 p-4 border border-gray-200 rounded-2xl shadow-sm bg-gray-50">
                <h3 className="text-lg font-semibold mb-2 text-gray-700">How to Play</h3>
                <div className="text-sm text-slate-600 grid grid-cols-1 md:grid-cols-2 gap-3">
                    <span className="p-2 bg-white border rounded-xl shadow-sm">💡 **Left-click** to reveal a cell.</span>
                    <span className="p-2 bg-white border rounded-xl shadow-sm">🚩 **Right-click** or **Shift+Click** to place/remove a flag.</span>
                    <span className="p-2 bg-white border rounded-xl shadow-sm">📱 **Touch users:** Use the **Flag Mode** button to toggle between revealing and flagging.</span>
                    <span className="p-2 bg-white border rounded-xl shadow-sm">🧪 **Double-click** a revealed number (Chord) to clear safe neighbors.</span>
                </div>
              </div>


              {/* Win/Lose Banner */}
              {(!alive || won) && (
                <div className="mt-4 p-4 rounded-2xl border shadow-lg animate-bounce-in bg-white border-green-500">
                  <p className={`text-center text-xl font-bold ${won ? 'text-green-600' : 'text-red-600'}`}>
                    {won ? "You cleared the board — Nice! 🎉" : "Boom! Try again? 💀"}
                  </p>
                </div>
              )}
          </div>
        );
      }

      // --- Main Render Call ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(Minesweeper));
    </script>
  </body>
</html>
