<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- CRITICAL FIX: Stops mobile browser zooming on tap and ensures initial scale is 1.0 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Minesweeper | Fully Responsive Game</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Development UMD builds) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for in-browser JSX/TSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Apply Inter font and set up full-page container */
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9; /* bg-slate-100 */
        margin: 0;
        padding: 0;
        /* Ensure the body takes up the full screen height */
        min-height: 100vh;
      }
      
      #minesweeper-grid {
        display: grid;
        margin: 0 auto;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        /* Use CSS variables for sizing, defined dynamically by React */
        grid-template-columns: repeat(var(--cols), var(--cell-size));
        grid-template-rows: repeat(var(--rows), var(--cell-size));
        
        /* Set fixed width/height based on React calculation */
        width: var(--grid-width);
        height: var(--grid-height);
        
        /* Ensure grid cells don't wrap and cause scroll */
        flex-shrink: 0;
      }
      .cell-button {
        /* Set explicit width/height based on the calculated variable */
        width: var(--cell-size, 30px);
        height: var(--cell-size, 30px); 
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        /* Scale font relative to the calculated cell size */
        font-size: calc(var(--cell-size, 30px) * 0.5); 
        border: 1px solid #ccc; 
        box-sizing: border-box;
      }

      /* Number color classes for Minesweeper */
      .num-1 { color: #1565C0; } 
      .num-2 { color: #388E3C; } 
      .num-3 { color: #D32F2F; } 
      .num-4 { color: #7B1FA2; } 
      .num-5 { color: #FF6F00; } 
      .num-6 { color: #00838F; } 
      .num-7 { color: #000000; } 
      .num-8 { color: #616161; } 
    </style>
  </head>
  <!-- Use flex column layout for the body content -->
  <body class="flex flex-col min-h-screen">
    <div id="root" class="flex-grow flex justify-center items-center p-4"></div>

    <script type="text/babel" data-presets="typescript,react">
      const { useEffect, useMemo, useRef, useState, useCallback } = React;

      // --- Constants ---
      const DIFFICULTIES = [
        { label: "Beginner (9x9, 10 Mines)", cols: 9, rows: 9, mines: 10 },
        { label: "Intermediate (16x16, 40 Mines)", cols: 16, rows: 16, mines: 40 },
        { label: "Expert (30x16, 99 Mines)", cols: 30, rows: 16, mines: 99 },
      ];
      
      const numberClass = {
        1: "num-1", 2: "num-2", 3: "num-3", 4: "num-4",
        5: "num-5", 6: "num-6", 7: "num-7", 8: "num-8",
      };

      // --- Helpers (unchanged logic) ---
      function createEmptyBoard(cols, rows) {
        const grid = [];
        for (let y = 0; y < rows; y++) {
          const row = [];
          for (let x = 0; x < cols; x++) {
            row.push({ x, y, isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 });
          }
          grid.push(row);
        }
        return grid;
      }

      function inBounds(cols, rows, x, y) {
        return x >= 0 && y >= 0 && x < cols && y < rows;
      }

      function neighborsOf(cols, rows, x, y) {
        const neighbors = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx;
            const ny = y + dy;
            if (inBounds(cols, rows, nx, ny)) {
              neighbors.push({ x: nx, y: ny });
            }
          }
        }
        return neighbors;
      }

      function initializeBoard(cols, rows, mines, startX, startY) {
        let newBoard = createEmptyBoard(cols, rows);
        const cellsToAvoid = new Set();
        
        for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
                const ax = startX + dx;
                const ay = startY + dy;
                if (inBounds(cols, rows, ax, ay)) {
                    cellsToAvoid.add(`${ax},${ay}`);
                }
            }
        }

        let minesPlaced = 0;
        while (minesPlaced < mines) {
          const x = Math.floor(Math.random() * cols);
          const y = Math.floor(Math.random() * rows);

          if (!newBoard[y][x].isMine && !cellsToAvoid.has(`${x},${y}`)) {
            newBoard[y][x].isMine = true;
            minesPlaced++;
          }
        }

        newBoard = newBoard.map((row, y) => row.map((cell, x) => {
          if (!cell.isMine) {
            cell.neighborMines = neighborsOf(cols, rows, x, y).reduce((count, n) => {
              return count + (newBoard[n.y][n.x].isMine ? 1 : 0);
            }, 0);
          }
          return cell;
        }));

        return newBoard;
      }

      // --- Component ---
      function Minesweeper() {
        const [difficulty, setDifficulty] = useState(DIFFICULTIES[0]);
        const [board, setBoard] = useState(() => createEmptyBoard(difficulty.cols, difficulty.rows));
        const [alive, setAlive] = useState(true);
        const [minesLeft, setMinesLeft] = useState(difficulty.mines);
        const [initialized, setInitialized] = useState(false);
        const [won, setWon] = useState(false);
        const [flagMode, setFlagMode] = useState(false);
        
        // State to hold the dynamically calculated pixel dimensions
        const [gridDimensions, setGridDimensions] = useState({ cellSize: 30, gridWidth: 9 * 30, gridHeight: 9 * 30 });

        const { cols, rows, mines } = difficulty;

        const totalSafeCells = useMemo(() => cols * rows - mines, [cols, rows, mines]);

        // Ref for the main control/header div to get its height
        const controlsRef = useRef(null);

        // --- Core Sizing Logic ---
        const calculateGridSize = useCallback(() => {
            // Get current window dimensions
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            // Get the height of the controls/header (approximate if ref is not ready)
            const controlsHeight = controlsRef.current ? controlsRef.current.offsetHeight : 150; 
            
            // Define the maximum usable area based on user's request (80% W, 70% H)
            // Use 90% width for a slightly safer margin, but prioritize 70% height for vertical space
            const maxUsableWidth = windowWidth * 0.90; 
            const maxUsableHeight = windowHeight * 0.70; 

            // Calculate available space for the grid specifically (subtract header/footer margins)
            const availableGridWidth = maxUsableWidth;
            const availableGridHeight = maxUsableHeight - controlsHeight; // Subtract header height

            // 1. Calculate the maximum possible cell size based on width and height constraints
            const maxCellSizeByWidth = Math.floor(availableGridWidth / cols);
            const maxCellSizeByHeight = Math.floor(availableGridHeight / rows);

            // The cell size must be the minimum of the two to keep cells square and prevent overflow
            let finalCellSize = Math.min(maxCellSizeByWidth, maxCellSizeByHeight);
            
            // Add a lower bound to cell size to keep it somewhat playable on tiny screens (e.g., 18px)
            finalCellSize = Math.max(18, finalCellSize);

            // 2. Calculate the final grid dimensions
            const finalGridWidth = finalCellSize * cols;
            const finalGridHeight = finalCellSize * rows;
            
            setGridDimensions({ 
                cellSize: finalCellSize, 
                gridWidth: finalGridWidth, 
                gridHeight: finalGridHeight 
            });

        }, [cols, rows]);

        useEffect(() => {
            // Recalculate size when the component mounts, difficulty changes, or window resizes
            calculateGridSize(); 
            window.addEventListener('resize', calculateGridSize);
            return () => window.removeEventListener('resize', calculateGridSize);
        }, [calculateGridSize, difficulty]);

        // Apply calculated size via CSS Custom Properties
        const gridStyle = {
            '--cell-size': `${gridDimensions.cellSize}px`,
            '--grid-width': `${gridDimensions.gridWidth}px`,
            '--grid-height': `${gridDimensions.gridHeight}px`,
            '--cols': cols,
            '--rows': rows,
        };

        // --- Core Game Logic (simplified) ---
        const floodFill = useCallback((currentBoard, x, y) => { 
          if (!inBounds(cols, rows, x, y) || currentBoard[y][x].isRevealed) {
            return [currentBoard, false];
          }
          const cell = currentBoard[y][x];
          cell.isRevealed = true;
          cell.isFlagged = false; 

          if (cell.isMine) {
            return [currentBoard, true]; 
          }

          if (cell.neighborMines === 0) {
            for (const { x: nx, y: ny } of neighborsOf(cols, rows, x, y)) {
                const [nextBoard, exploded] = floodFill(currentBoard, nx, ny);
                currentBoard = nextBoard;
                if (exploded) return [currentBoard, true];
            }
          }
          return [currentBoard, false];
        }, [cols, rows]);

        const handleCellClick = useCallback((x, y, isFlagging) => { 
          setBoard(prevBoard => {
            if (!alive || won) return prevBoard;
            let newBoard = [...prevBoard.map(row => [...row])];
            let cell = newBoard[y][x];
            
            if (isFlagging || flagMode) {
              if (cell.isRevealed) return prevBoard;
              cell.isFlagged = !cell.isFlagged;
              setMinesLeft(m => m + (cell.isFlagged ? -1 : 1));
              return newBoard;
            }

            if (!initialized) {
              newBoard = initializeBoard(cols, rows, mines, x, y);
              cell = newBoard[y][x]; 
              setInitialized(true);
            }
            
            if (cell.isFlagged || cell.isRevealed) return prevBoard;

            if (cell.isMine) {
              cell.isRevealed = true;
              setAlive(false);
              return newBoard; 
            }

            const [filledBoard, exploded] = floodFill(newBoard, x, y);
            if (exploded) setAlive(false); 
            
            return filledBoard;
          });
        }, [alive, won, initialized, cols, rows, mines, flagMode, floodFill]);

        const handleChord = useCallback((x, y) => { 
            setBoard(prevBoard => {
                if (!alive || won) return prevBoard;
                
                const cell = prevBoard[y][x];
                if (!cell.isRevealed || cell.neighborMines === 0) return prevBoard;

                const currentNeighbors = neighborsOf(cols, rows, x, y);
                const flaggedNeighbors = currentNeighbors.filter(n => prevBoard[n.y][n.x].isFlagged).length;

                if (flaggedNeighbors === cell.neighborMines) {
                    let newBoard = [...prevBoard.map(row => [...row])];
                    let exploded = false;

                    currentNeighbors.forEach(n => {
                        const neighborCell = newBoard[n.y][n.x];
                        if (!neighborCell.isFlagged && !neighborCell.isRevealed) {
                            if (neighborCell.isMine) {
                                neighborCell.isRevealed = true;
                                exploded = true;
                            } else {
                                const [filledBoard, exp] = floodFill(newBoard, n.x, n.y);
                                newBoard = filledBoard;
                                if (exp) exploded = true;
                            }
                        }
                    });

                    if (exploded) setAlive(false);
                    return newBoard;
                }
                return prevBoard;
            });
        }, [alive, won, cols, rows, floodFill]);

        // Win check, Reset game, and Context Menu logic remain the same
        useEffect(() => {
          if (!alive || won) return;

          const revealedCount = board.reduce(
            (count, row) => count + row.filter(cell => cell.isRevealed && !cell.isMine).length, 0
          );

          if (revealedCount === totalSafeCells && totalSafeCells > 0) {
            setWon(true);
            setBoard(b => b.map(row => row.map(cell => cell.isMine && !cell.isFlagged ? { ...cell, isFlagged: true } : cell)));
            setMinesLeft(0);
          }
        }, [board, alive, won, totalSafeCells]);

        const resetGame = useCallback((newDifficulty = difficulty) => {
          setDifficulty(newDifficulty);
          setBoard(createEmptyBoard(newDifficulty.cols, newDifficulty.rows));
          setAlive(true);
          setWon(false);
          setInitialized(false);
          setMinesLeft(newDifficulty.mines);
          calculateGridSize(); // Recalculate size on reset
        }, [difficulty, calculateGridSize]);

        useEffect(() => {
          const handleContext = (e) => { 
            const target = e.target;
            if (!target || !(target instanceof HTMLElement) || !target.closest('#minesweeper-grid')) {
              e.preventDefault();
            }
          };
          document.addEventListener('contextmenu', handleContext);
          return () => document.removeEventListener('contextmenu', handleContext);
        }, []);

        const handleContextMenu = (e, x, y) => { 
          e.preventDefault();
          e.stopPropagation();
          const isFlagging = e.shiftKey || !flagMode;
          handleCellClick(x, y, isFlagging);
        };
        
        const buttonBaseClass = "cell-button transition-all duration-75 text-center cursor-pointer select-none border-gray-400";

        return (
          <div className="w-full max-w-7xl flex flex-col items-center">
            
            {/* Header/Controls Area (Used for height calculation) */}
            <div ref={controlsRef} className="w-full max-w-4xl p-4 md:p-8 bg-white rounded-3xl shadow-xl flex flex-col mb-4">
              <h1 className="text-3xl font-extrabold text-gray-800 text-center mb-6">Minesweeper</h1>

              <div className="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                {/* Difficulty Selector */}
                <select
                  className="p-2 border border-gray-300 rounded-lg shadow-sm text-sm"
                  value={difficulty.label}
                  onChange={(e) => {
                    const newDiff = DIFFICULTIES.find(d => d.label === e.target.value);
                    if (newDiff) resetGame(newDiff);
                  }}
                  disabled={initialized && alive}
                >
                  {DIFFICULTIES.map(d => (
                    <option key={d.label} value={d.label}>{d.label}</option>
                  ))}
                </select>

                {/* Status and Reset */}
                <div className="flex items-center gap-4">
                  <span className={`text-xl font-mono px-3 py-1 rounded-lg ${minesLeft < 0 ? 'bg-red-200' : 'bg-green-100'} text-gray-800 shadow-inner`}>
                    🚩 {Math.max(0, minesLeft)}
                  </span>
                  <button
                    onClick={() => resetGame()}
                    className={`p-2 rounded-full text-2xl transition-transform ${alive && initialized ? 'hover:scale-110 active:scale-95' : 'bg-yellow-200 hover:bg-yellow-300 active:bg-yellow-400'}`}
                    title="Reset Game"
                  >
                    {won ? '😎' : alive && initialized ? '🤔' : alive ? '😊' : '🤕'}
                  </button>
                </div>

                {/* Touch Flag Mode Toggle */}
                <button
                  onClick={() => setFlagMode(f => !f)}
                  className={`sm:hidden p-2 text-sm rounded-lg font-medium transition-colors ${
                    flagMode ? 'bg-indigo-600 text-white shadow-md' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
                  }`}
                >
                  {flagMode ? 'Flag Mode: ON 🚩' : 'Flag Mode: OFF'}
                </button>
              </div>
            </div>

            {/* Game Grid Container: Centered using flex properties */}
            <div className="flex-grow flex justify-center items-center w-full">
                <div id="minesweeper-grid" style={gridStyle} className="bg-gray-100 rounded-xl shadow-inner">
                  {board.map((row, y) =>
                    row.map((cell, x) => {
                      const { isRevealed: revealed, isMine: mine, isFlagged: flagged } = cell;

                      const btnClass = 
                        `${buttonBaseClass} ` +
                        (revealed 
                          ? (mine 
                            ? 'bg-red-500 text-white' 
                            : 'bg-gray-200 border-gray-300 shadow-inner') 
                          : (alive && initialized 
                            ? 'bg-green-400 hover:bg-green-500 active:bg-green-600 border-b-4 border-r-4 border-t-2 border-l-2 border-green-500 active:border-green-700' 
                            : 'bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600 border-b-4 border-r-4 border-t-2 border-l-2 border-yellow-500 active:border-yellow-700')
                        );

                      return (
                        <button
                          key={`${x}-${y}`}
                          className={btnClass}
                          onClick={() => handleCellClick(x, y, false)}
                          onContextMenu={(e) => handleContextMenu(e, x, y)}
                          onDoubleClick={() => handleChord(x, y)}
                          disabled={!alive || won}
                          aria-label={`cell ${x},${y}`}
                        >
                          {!revealed && flagged && "🚩"}
                          {revealed && mine && "💣"}
                          {revealed && !mine && cell.neighborMines > 0 && (
                            <span className={numberClass[cell.neighborMines] || ""}>{cell.neighborMines}</span>
                          )}
                        </button>
                      );
                    })
                  )}
                </div>
            </div>

            {/* Win/Lose Banner */}
            {(!alive || won) && (
              <div className="mt-4 p-4 rounded-2xl border shadow-lg animate-bounce-in bg-white border-green-500 w-full max-w-4xl">
                <p className={`text-center text-xl font-bold ${won ? 'text-green-600' : 'text-red-600'}`}>
                  {won ? "You cleared the board — Nice! 🎉" : "Boom! Try again? 💀"}
                </p>
              </div>
            )}
            
            {/* Footer / How to Play Section (positioned at the bottom) */}
            <div className="mt-4 p-4 border border-gray-200 rounded-2xl shadow-sm bg-white w-full max-w-4xl">
              <h3 className="text-lg font-semibold mb-2 text-gray-700">How to Play</h3>
              <div className="text-sm text-slate-600 grid grid-cols-1 md:grid-cols-2 gap-3">
                  <span className="p-2 bg-slate-50 border rounded-xl shadow-sm">💡 **Left-click** to reveal a cell.</span>
                  <span className="p-2 bg-slate-50 border rounded-xl shadow-sm">🚩 **Right-click** or **Shift+Click** to place/remove a flag.</span>
                  <span className="p-2 bg-slate-50 border rounded-xl shadow-sm">📱 **Touch users:** Use the **Flag Mode** button to toggle between revealing and flagging.</span>
                  <span className="p-2 bg-slate-50 border rounded-xl shadow-sm">🧪 **Double-click** a revealed number (Chord) to clear safe neighbors.</span>
              </div>
            </div>
          </div>
        );
      }

      // --- Main Render Call ---
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(Minesweeper));
    </script>
  </body>
</html>
